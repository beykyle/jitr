# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: 
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install package and dependencies
        run: uv sync --frozen --all-groups

      - name: Ruff
        run: uv run ruff check .

      - name: Black
        run: uv run black --check .

      - name: Flake8
        run: uv run flake8 src tests

      - name: Mypy
        run: uv run mypy src

      - name: Import without numba or lax
        run: uv run python -c "import jitr; import sys; assert 'numba' not in sys.modules and 'lax' not in sys.modules"

      - name: Run unit tests
        # lax is not yet on PyPI; tests marked requires_lax auto-skip without it
        run: uv run pytest

      - name: Run notebook tests
        # the ignored notebooks need the lax solver package and rejoin CI
        # once lax is published
        run: >-
          uv run --group examples pytest --nbval-lax --current-env
          examples/notebooks/
          --ignore=examples/notebooks/quickstart.ipynb
          --ignore=examples/notebooks/chex_jitr_validation.ipynb
          --ignore=examples/notebooks/local_omp_demo.ipynb
          --ignore=examples/notebooks/kduq_uq_demo.ipynb
          --ignore=examples/notebooks/example_jlm.ipynb
          --ignore=examples/notebooks/builtin_omps_uq.ipynb
          --ignore=examples/notebooks/angular_reaction_xs.ipynb
          --ignore=examples/notebooks/mass_exploration.ipynb
          --ignore=examples/notebooks/convergence_channel_radius.ipynb

      - name: Build package
        run: uv build
